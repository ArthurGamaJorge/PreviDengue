name: Atualização Semanal dos Dados de Dengue

on:
  schedule: # Terça feira, às quatro da manhã (BRT)
    - cron: '0 7 * * 2'
  workflow_dispatch:

jobs:
  update-data-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      id-token: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup do Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalação das dependências
        working-directory: ./ai_predict/data/pipeline_scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade 'huggingface_hub[cli]'

      - name: Download dos dados climáticos existentes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          os.makedirs('./ai_predict/data', exist_ok=True)
          hf_hub_download(
              repo_id='previdengue/predict_climate_data',
              filename='dadosClimaticos.parquet',
              repo_type='dataset',
              local_dir='./ai_predict/data',
              local_dir_use_symlinks=False,
              token=os.environ.get('HF_TOKEN')
          )
          print('✓ Download concluído: dadosClimaticos.parquet')
          PY

      - name: Executa o pipeline de atualização de dados
        working-directory: ./ai_predict/data/pipeline_scripts
        run: python master_update.py

      - name: Calcula flags epidemiológicas para commit do CSV
        run: |
          python - <<'PY' > env.txt
          from datetime import date
          from epiweeks import Week
          tw = Week.fromdate(date.today()) - 3
          is_last = int((tw + 1).year != tw.year)

          # a cada 6 semanas ou na última semana
          should_commit = int((tw.week % 6 == 0) or is_last)

          target_year = tw.year
          print(f"TARGET_YEAR={target_year}")
          print(f"EPI_WEEK={tw.week}")
          print(f"IS_LAST_EPI_WEEK={is_last}")
          print(f"SHOULD_COMMIT={should_commit}")
          print(f"TARGET_FILENAME=ai_predict/data/casos/mun{target_year}.csv")
          PY
          cat env.txt >> $GITHUB_ENV
          rm env.txt

      - name: Commit do CSV do ano 
        if: env.SHOULD_COMMIT == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "${{ env.TARGET_FILENAME }}" ]; then
            git add "${{ env.TARGET_FILENAME }}"
            git diff --staged --quiet || git commit -m "chore(data): versionar CSV anual (ano ${{ env.TARGET_YEAR }}, epiweek ${{ env.EPI_WEEK }})"
            git push
          else
            echo "Arquivo não encontrado: ${{ env.TARGET_FILENAME }}. Pulando commit."
          fi

      - name: Upload dos dados climáticos atualizados para o Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_file(
              path_or_fileobj='./ai_predict/data/dadosClimaticos.parquet',
              path_in_repo='dadosClimaticos.parquet',
              repo_id='previdengue/predict_climate_data',
              repo_type='dataset',
              commit_message='chore(data): 🤖 Atualização semanal automática dos dados climáticos'
          )
          print('✓ Upload concluído: dadosClimaticos.parquet')
          PY

      - name: Upload dos dados de inferência para o Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_file(
              path_or_fileobj='./ai_predict/data/inference_data.parquet',
              path_in_repo='inference_data.parquet',
              repo_id='previdengue/predict_inference_data',
              repo_type='dataset',
              commit_message='chore(data): ✨ Atualização semanal automática dos dados de inferência'
          )
          print('✓ Upload concluído: inference_data.parquet')
          PY

      - name: Upload dos dados estaduais de inferência para o Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_file(
              path_or_fileobj='./ai_predict/data/inference_data_estadual.parquet',
              path_in_repo='inference_data_estadual.parquet',
              repo_id='previdengue/predict_inference_data_estadual',
              repo_type='dataset',
              commit_message='chore(data): 🏛️ Atualização semanal automática dos dados estaduais de inferência'
          )
          print('✓ Upload concluído: inference_data_estadual.parquet')
          PY
